# Testet und baut S3cure SSH Client für macOS (Apple Silicon + Intel), Windows und Linux.
# - Zuerst laufen die Tests (Einheitentests + Integrationstest gegen einen lokalen sshd); nur wenn sie
#   grün sind, wird gebaut.
# - Push auf main, Pull Requests gegen main und manuell: Installer als Artefakte
# - Tag v* (z. B. v1.2.0): zusätzlich ein GitHub-Release mit den Installern; die Version kommt aus dem Tag,
#   der Release-Text aus dem passenden Abschnitt in CHANGELOG.md (darunter der englische aus CHANGELOG.en.md)
# Ohne Code-Signierung (macOS: Rechtsklick > Öffnen; Windows: „Trotzdem ausführen“).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten installieren
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # Electron selbst wird für den Integrationstest gebraucht (sonst lädt es nur der Packager)
          node node_modules/electron/install.js

      - name: sshd und virtueller Bildschirm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server xvfb x11-utils xclip iproute2 tigervnc-standalone-server tigervnc-tools >/dev/null

      - name: Syntax prüfen
        run: for f in main.js preload.js lib/*.js src/*.js tools/*.mjs test/*/*.js test/*/*.mjs; do node --check "$f"; done

      - name: Einheitentests
        run: npm test

      - name: Integrationstest (Electron gegen lokalen sshd)
        run: xvfb-run -a npm run test:integration

      - name: Release-Text vorhanden? (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node tools/release-notes.mjs "$GITHUB_REF_NAME" >/dev/null || echo "::warning::CHANGELOG.md hat keinen Abschnitt für $GITHUB_REF_NAME – das Release bekommt automatische Notizen."
          grep -qE "^## \[?v?${GITHUB_REF_NAME#v}\]?( |$)" ../CHANGELOG.en.md 2>/dev/null || echo "::warning::CHANGELOG.en.md hat keinen Abschnitt für $GITHUB_REF_NAME – der Release-Text ist nur deutsch."

  # S3cure Agent (Handy-App): Tests, echte Installation auf Ubuntu mit systemd, Paket fürs Release
  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Abhängigkeiten, Syntax, Tests
        run: |
          npm ci --no-audit --no-fund
          for f in lib/*.js bin/*.js public/*.js test/*.js; do node --check "$f"; done
          bash -n install.sh
          npm test

      - name: Paket bauen (s3cure-agent.tar.gz)
        run: |
          mkdir -p ../dist/pkg/s3cure-agent
          cp -a bin lib public package.json package-lock.json install.sh README.md ../dist/pkg/s3cure-agent/
          tar czf ../dist/s3cure-agent.tar.gz -C ../dist/pkg s3cure-agent
          ls -la ../dist/s3cure-agent.tar.gz

      - name: Echte Installation aus dem Paket und Probe
        run: |
          mkdir -p /tmp/probe && tar xzf ../dist/s3cure-agent.tar.gz -C /tmp/probe
          sudo env "PATH=$PATH" /tmp/probe/s3cure-agent/install.sh
          printf 'probe-passwort-123\n' | sudo env "PATH=$PATH" s3cure-agent user add probe --admin --password-stdin >/dev/null
          sudo env "PATH=$PATH" node test/probe.js probe probe-passwort-123
          # Update: erneut installieren, Benutzer bleibt
          sudo env "PATH=$PATH" /tmp/probe/s3cure-agent/install.sh >/dev/null
          sudo env "PATH=$PATH" s3cure-agent user list | grep -q '^probe'

      - uses: actions/upload-artifact@v4
        with:
          name: S3cure Agent
          path: dist/s3cure-agent.tar.gz
          if-no-files-found: error
          retention-days: 30

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            script: build
            zip: S3cure-SSH-Client-Mac-AppleSilicon.zip
            smoke: "../dist/S3cure SSH Client-darwin-arm64/S3cure SSH Client.app/Contents/MacOS/S3cure SSH Client"
          - name: macOS Intel
            # Läuft auf dem Apple-Silicon-Runner und baut für x64 (Electron wird passend geladen)
            os: macos-latest
            script: build:mac-intel
            zip: S3cure-SSH-Client-Mac-Intel.zip
            smoke: ''
          - name: Windows x64
            os: windows-latest
            script: build:win
            smoke: "../dist/S3cure SSH Client-win32-x64/S3cure SSH Client.exe"
          - name: Linux x64
            os: ubuntu-latest
            script: build:linux
            smoke: ''
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # Ohne Install-Skripte: keine nativen Zusätze (ssh2 läuft auch ohne), Electron lädt der Packager selbst
      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax prüfen
        run: for f in main.js preload.js lib/*.js src/*.js tools/*.mjs; do node --check "$f"; done

      - name: Bauen
        run: npm run ${{ matrix.script }}

      - name: Start-Rauchtest
        if: matrix.smoke != ''
        run: node tools/smoke-test.mjs "${{ matrix.smoke }}"

      # Linux: fertiges AppImage starten (ohne FUSE: selbst entpacken) und prüfen,
      # dass der Updater es als AppImage erkennt
      - name: Start-Rauchtest (AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          S3CURE_EXPECT_KIND: linux-appimage
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          xvfb-run -a node tools/smoke-test.mjs ../dist/S3cure-SSH-Client-Linux-x64.AppImage --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: S3cure SSH Client – ${{ matrix.name }}
          # Nur die Installer: Mac-DMG (auch für die automatischen Updates), Windows-Setup.exe, Linux-AppImage
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Nur für CHANGELOG.md, CHANGELOG.en.md und das Skript, das den Release-Text daraus holt
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          FILES=(dist/*.dmg dist/*.exe dist/*.AppImage dist/s3cure-agent.tar.gz)
          # Release-Text: Abschnitt der Version aus CHANGELOG.md, darunter (nach „<!-- lang:en -->“) der aus
          # CHANGELOG.en.md – die App zeigt davon den Teil in ihrer Sprache als „Was ist neu?“ (app/lib/release-notes.js)
          if node app/tools/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md; then
            NOTES=(--notes-file release-notes.md)
          else
            echo "::warning::Kein Abschnitt für ${GITHUB_REF_NAME#v} in CHANGELOG.md – automatische Notizen"
            NOTES=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "S3cure SSH Client ${GITHUB_REF_NAME#v}" "${NOTES[@]}"
          fi
