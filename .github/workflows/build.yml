# Baut S3cure SSH Client für macOS (Apple Silicon + Intel) und Windows.
# - Push auf main, Pull Requests gegen main und manuell: Builds als Artefakte (ZIPs)
# - Tag v* (z. B. v1.2.0): zusätzlich ein GitHub-Release mit den ZIPs; die Version kommt aus dem Tag
# Ohne Code-Signierung (macOS: Rechtsklick > Öffnen; Windows: „Trotzdem ausführen“).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            script: build
            zip: S3cure-SSH-Client-Mac-AppleSilicon.zip
            smoke: "../dist/S3cure SSH Client-darwin-arm64/S3cure SSH Client.app/Contents/MacOS/S3cure SSH Client"
          - name: macOS Intel
            # Läuft auf dem Apple-Silicon-Runner und baut für x64 (Electron wird passend geladen)
            os: macos-latest
            script: build:mac-intel
            zip: S3cure-SSH-Client-Mac-Intel.zip
            smoke: ''
          - name: Windows x64
            os: windows-latest
            script: build:win
            zip: S3cure-SSH-Client-Windows-x64.zip
            smoke: "../dist/S3cure SSH Client-win32-x64/S3cure SSH Client.exe"
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # Ohne Install-Skripte: keine nativen Zusätze (ssh2 läuft auch ohne), Electron lädt der Packager selbst
      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax prüfen
        run: for f in main.js preload.js lib/*.js src/*.js tools/*.mjs; do node --check "$f"; done

      - name: Bauen
        run: npm run ${{ matrix.script }}

      - name: Start-Rauchtest
        if: matrix.smoke != ''
        run: node tools/smoke-test.mjs "${{ matrix.smoke }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
              --title "S3cure SSH Client ${GITHUB_REF_NAME#v}" --generate-notes
          fi
